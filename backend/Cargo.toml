[package]
name = "questionnaire-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
csv = "1"
dotenvy = "0.15"
getrandom = "0.4"
hex = "0.4"
sea-orm = { version = "~2.0.4", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "~2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
questionnaire-logic = { path = "../logic-core" }
url = "2"
utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
