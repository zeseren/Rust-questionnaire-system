[package]
name = "logic-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
# cdylib 供 wasm-pack 产出 .wasm；rlib 让原生 cargo test 直接链接同一段边界代码。
crate-type = ["cdylib", "rlib"]

[dependencies]
questionnaire-logic = { path = "../logic-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack]
# wasm-pack 0.15 的 wasm-opt 调用不带 --enable-bulk-memory-opt(binaryen 133 默认关闭该特性,
# 而 wasm-bindgen 产物含 memory.copy),故构建脚本改用 --no-opt + 显式 wasm-opt;
# 此处保留 false 以防有人直接跑 wasm-pack 时踩同一坑。
wasm-opt = false
